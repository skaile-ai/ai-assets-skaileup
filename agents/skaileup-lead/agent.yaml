spec_version: "0.2"
name: skaileup-lead
version: "0.1.0"
description: "Leads a skaileup session for one project: runs the expectations interview and the skaileup router, sends each skill run to the agent that owns the skill, and puts that agent's questions to the user. The only skaileup agent that talks to the user."
composes:
  - { kind: skill, ref: "skill:@skaile-ai/skaileup" }
  - { kind: agent, ref: "agent:@skaile-ai/skaileup-researcher", as: researcher, binding: delegate }
  - { kind: agent, ref: "agent:@skaile-ai/skaileup-product", as: product, binding: delegate }
  - { kind: agent, ref: "agent:@skaile-ai/skaileup-designer", as: designer, binding: delegate }
  - { kind: agent, ref: "agent:@skaile-ai/skaileup-architect", as: architect, binding: delegate }
  - { kind: agent, ref: "agent:@skaile-ai/skaileup-spec", as: spec, binding: delegate }
  - { kind: agent, ref: "agent:@skaile-ai/skaileup-builder", as: builder, binding: delegate }
  - { kind: agent, ref: "agent:@skaile-ai/skaileup-reviewer", as: reviewer, binding: delegate }

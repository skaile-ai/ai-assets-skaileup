# yaml-language-server: $schema=https://cdn.jsdelivr.net/npm/@skaile/model@1/schema/model.schema.json
version: 1

enums:
  cuisine:
    Italian: Pasta, pizza, risotto
    Asian: Noodles, curry, sushi
    Mediterranean: Mezze, grilled dishes, salads
    Local: Regional home cooking
    Vegetarian: Meat-free kitchen

entities:
  Member:
    label_field: display_name
    fields:
      display_name: { type: string, max_length: 80 }
      email: { type: email, unique: true }
      diet:
        type: enum
        values: { Any: Eats everything, Vegetarian: No meat or fish, Vegan: No animal products }

  Place:
    label_field: name
    fields:
      name: { type: string, max_length: 100 }
      cuisine: { type: enum, enum: cuisine }
      walking_minutes: { type: integer, description: Minutes on foot from the office door }
      website: { type: url, required: false }
      price_level: { type: integer, required: false }

  Poll:
    label_field: title
    fields:
      title: { type: string, max_length: 120 }
      status:
        type: enum
        values: { Open: Members can still vote, Closed: "Voting is over, a pick is made" }
      closes_at: datetime
      organizer_id: { type: m2o, to: Member, on_delete: restrict }
      pick_id: { type: m2o, to: Place, required: false, on_delete: set_null, label: Pick }

  Vote:
    label_field: reason
    fields:
      reason: { type: string, required: false, max_length: 140 }
      poll_id: { type: m2o, to: Poll, on_delete: cascade }
      place_id: { type: m2o, to: Place, on_delete: cascade }
      member_id: { type: m2o, to: Member, on_delete: cascade }

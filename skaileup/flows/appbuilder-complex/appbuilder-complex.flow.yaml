id: appbuilder-complex
version: '2.0.0'
name: 'Appbuilder Complex'
description: >-
  Multi-product / enterprise. Superset of appbuilder-standard plus brand-voice,
  mockup-walkthrough-framework, non-optional infrastructure,
  project-overview/subsystem-map/integration/review project ops, eval-code +
  audit quality (audit runs every slice — expressed via edge ordering since the
  schema has no loop construct), full mockup-feedback cluster. Per-feature work
  is delegated to the unified skaileup-slice sub-flow (concept_depth: full) —
  supervised dispatch runs inside the impl half (every slice, every tier), so it
  is no longer a complex-only node. eval-code + audit run after each slice loop.
  Iteration semantics: the slice loop + q-eval-code/q-audit run once per feature;
  the linear graph below shows one iteration. Composition: scope-project ->
  high-level concept -> project-overview -> impl-build setup -> loop: [sub-flow]
  skaileup-slice (concept then impl) -> impl-quality/audit (every slice)
  -> done.
meta:
  category: full-stack
  tags:
    - tier
    - appbuilder-complex
    - enterprise
    - multi-product
  icon: i-heroicons-building-library
requires:
  # Everything installed when this flow is installed: the contracts its skills
  # read + every skill its nodes run (flow node order). Self-contained — no
  # inheritance, no extras.
  - contract:@skaile-ai/shared-contracts
  - contract:@skaile-ai/meta-concept-contract
  - skill:@skaile-ai/skaileup-scope-scope-project
  - flow:@skaile-ai/concept-discovery
  - skill:@skaile-ai/design-brand-visual
  - skill:@skaile-ai/design-brand-voice
  - skill:@skaile-ai/design-inspiration
  - skill:@skaile-ai/experience-journeys
  - skill:@skaile-ai/experience-behaviors
  - skill:@skaile-ai/product-spec-features
  - skill:@skaile-ai/experience-screens
  - skill:@skaile-ai/experience-components
  - skill:@skaile-ai/mockup-walkthrough-astro
  - skill:@skaile-ai/mockup-walkthrough-framework
  - skill:@skaile-ai/mockup-walkthrough-static-html
  - skill:@skaile-ai/mockup-component-storybook
  - flow:@skaile-ai/mockup-feedback
  - skill:@skaile-ai/ops-project-overview
  - skill:@skaile-ai/ops-project-subsystem-map
  - skill:@skaile-ai/ops-project-integration
  - skill:@skaile-ai/ops-project-review
  - flow:@skaile-ai/architecture
  - flow:@skaile-ai/impl-build-setup
  # Per-feature work delegated to the unified slice sub-flow (its manifest and
  # its two sub-flows' manifests provide the loop skills, including
  # impl-plan-supervised, which runs inside the impl half on every slice).
  # eval-code + audit stay — complex-only, run after each slice loop.
  - flow:@skaile-ai/skaileup-slice
  - skill:@skaile-ai/impl-quality-eval-code
  - skill:@skaile-ai/impl-quality-audit
  - flow:@skaile-ai/quality-gate
globals:
  research_depth: deep
  approval_mode: checkpoint
  subagent_mode: false
  verbosity: detailed
entry: scope
nodes:
  # --- Phase containers (visual; must precede their children) ---
  - id: g-conceptualization
    type: group
    position:
      x: -40
      y: 0
    style:
      width: 4480
      height: 480
    data:
      label: 'Conceptualization'
      phase: conceptualization
  - id: g-implementation
    type: group
    position:
      x: 4960
      y: 0
    style:
      width: 1480
      height: 480
    data:
      label: 'Implementation'
      phase: implementation
  - id: g-review
    type: group
    position:
      x: 8760
      y: 0
    style:
      width: 680
      height: 480
    data:
      label: 'Review'
      phase: review
  # --- Scope ---
  - id: scope
    type: skill
    position:
      x: 0
      y: 200
    parentNode: g-conceptualization
    data:
      skill: skaileup-scope-scope-project
      label: 'Scope Project'
      optional: false
      parameters: {}
  # --- Discovery (delegated to the shared concept-discovery flow) ---
  - id: discovery
    type: sub-flow
    position:
      x: 200
      y: 200
    parentNode: g-conceptualization
    data:
      flow: concept-discovery
      domain: discovery
      label: 'Concept discovery (brief, goals, comparable)'
      pass_context: true
      phase: conceptualization
      parameters: {}
  - id: brand-visual
    type: skill
    position:
      x: 800
      y: 200
    parentNode: g-conceptualization
    data:
      skill: design-brand-visual
      label: 'Brand Visual'
      optional: false
      parameters: {}
  - id: brand-voice
    type: skill
    position:
      x: 1000
      y: 200
    parentNode: g-conceptualization
    data:
      skill: design-brand-voice
      label: 'Brand Voice'
      optional: false
      parameters: {}
  - id: inspiration
    type: skill
    position:
      x: 1200
      y: 200
    parentNode: g-conceptualization
    data:
      skill: design-inspiration
      label: 'Design Inspiration'
      optional: true
      parameters: {}
  - id: journeys
    type: skill
    position:
      x: 1400
      y: 200
    parentNode: g-conceptualization
    data:
      skill: experience-journeys
      label: 'Experience Journeys'
      optional: false
      parameters: {}
  - id: behaviors
    type: skill
    position:
      x: 1600
      y: 200
    parentNode: g-conceptualization
    data:
      skill: experience-behaviors
      label: 'Experience Behaviors'
      optional: false
      parameters: {}
  - id: features
    type: skill
    position:
      x: 1800
      y: 200
    parentNode: g-conceptualization
    data:
      skill: product-spec-features
      label: 'Product Features'
      optional: false
      parameters: {}
  - id: screens
    type: skill
    position:
      x: 2000
      y: 200
    parentNode: g-conceptualization
    data:
      skill: experience-screens
      label: 'Experience Screens'
      optional: false
      parameters: {}
  - id: components
    type: skill
    position:
      x: 2200
      y: 200
    parentNode: g-conceptualization
    data:
      skill: experience-components
      label: 'Experience Components'
      optional: false
      parameters: {}
  # --- Mockup renderer routers (first match wins; routes are authoritative) ---
  - id: route-walkthrough
    type: router
    position:
      x: 2300
      y: 100
    parentNode: g-conceptualization
    data:
      label: 'Walkthrough Renderer Router (astro -> framework -> static-html)'
      routes:
        - condition: 'stack.astro_available'
          target: mock-walkthrough-astro
        - condition: 'stack.framework_available'
          target: mock-framework
        - condition: 'default'
          target: mock-static-fallback
  - id: route-component
    type: router
    position:
      x: 2300
      y: 400
    parentNode: g-conceptualization
    data:
      label: 'Component Renderer Router (storybook or skip)'
      routes:
        - condition: 'stack.storybook_available'
          target: comp-storybook
        - condition: 'default'
          target: null
  - id: mock-walkthrough-astro
    type: skill
    position:
      x: 2400
      y: 100
    parentNode: g-conceptualization
    data:
      skill: mockup-walkthrough-astro
      label: 'Astro Walkthrough Mockup (via router)'
      optional: true
      parameters: {}
  - id: mock-framework
    type: skill
    position:
      x: 2400
      y: 200
    parentNode: g-conceptualization
    data:
      skill: mockup-walkthrough-framework
      label: 'Framework Walkthrough Mockup (via router)'
      optional: true
      parameters: {}
  - id: mock-static-fallback
    type: skill
    position:
      x: 2400
      y: 300
    parentNode: g-conceptualization
    data:
      skill: mockup-walkthrough-static-html
      label: 'Static HTML Walkthrough (router default)'
      optional: true
      parameters: {}
  - id: comp-storybook
    type: skill
    position:
      x: 2400
      y: 400
    parentNode: g-conceptualization
    data:
      skill: mockup-component-storybook
      label: 'Storybook Components (via router)'
      optional: true
      parameters: {}
  # --- Mockup feedback (delegated to the shared mockup-feedback flow) ---
  - id: feedback
    type: sub-flow
    position:
      x: 2600
      y: 200
    parentNode: g-conceptualization
    data:
      flow: mockup-feedback
      domain: mockup
      label: 'Mockup feedback loop'
      pass_context: true
      phase: conceptualization
      parameters: {}
  # --- Project overview (complex-only) ---
  - id: ops-project-overview
    type: skill
    position:
      x: 3400
      y: 200
    parentNode: g-conceptualization
    data:
      skill: ops-project-overview
      label: 'Project Overview'
      optional: false
      parameters: {}
  - id: ops-project-subsystem-map
    type: skill
    position:
      x: 3600
      y: 200
    parentNode: g-conceptualization
    data:
      skill: ops-project-subsystem-map
      label: 'Project Subsystem Map'
      optional: false
      parameters: {}
  - id: ops-project-integration
    type: skill
    position:
      x: 3800
      y: 200
    parentNode: g-conceptualization
    data:
      skill: ops-project-integration
      label: 'Project Integration'
      optional: false
      parameters: {}
  - id: ops-project-review
    type: skill
    position:
      x: 4000
      y: 200
    parentNode: g-conceptualization
    data:
      skill: ops-project-review
      label: 'Project Review'
      optional: false
      parameters: {}
  # --- Architecture (delegated to the shared architecture flow) ---
  - id: architecture
    type: sub-flow
    position:
      x: 4200
      y: 200
    parentNode: g-conceptualization
    data:
      flow: architecture
      domain: blueprint
      label: 'Architecture blueprint'
      pass_context: true
      phase: conceptualization
      parameters: {}
  # --- Build setup (delegated to the shared impl-build-setup flow) ---
  - id: build-setup
    type: sub-flow
    position:
      x: 5000
      y: 200
    parentNode: g-implementation
    data:
      flow: impl-build-setup
      domain: build
      label: 'One-time build setup (infrastructure required)'
      pass_context: true
      phase: implementation
      parameters:
        infrastructure: required
  # --- Per-feature loop (delegated to the unified slice flow) ---
  - id: slice-loop
    type: sub-flow
    position:
      x: 6200
      y: 200
    parentNode: g-implementation
    data:
      flow: skaileup-slice
      domain: slice
      label: 'Per-feature slice loop (concept then impl, full concept design)'
      pass_context: true
      phase: implementation
      parameters:
        concept_depth: full
  # --- Per-slice quality (audit every slice) ---
  - id: q-eval-code
    type: skill
    position:
      x: 8800
      y: 200
    parentNode: g-review
    data:
      skill: impl-quality-eval-code
      label: 'Eval Code'
      optional: false
      parameters: {}
  - id: q-audit
    type: skill
    position:
      x: 9000
      y: 200
    parentNode: g-review
    data:
      skill: impl-quality-audit
      label: 'Audit (every slice)'
      optional: false
      parameters: {}
  # --- Quality gate (delegated to the shared quality-gate flow) ---
  - id: quality
    type: sub-flow
    position:
      x: 9200
      y: 200
    parentNode: g-review
    data:
      flow: quality-gate
      domain: quality
      label: 'Quality gate + ops tail'
      pass_context: true
      phase: review
      parameters: {}

id: appbuilder-cli
version: '2.0.0'
name: 'Appbuilder CLI'
description: >-
  Command-line tool — no UI shell, no brand, no journeys/screens, no mockups,
  no E2E. End-to-end: linear CLI concept (scope -> brief -> features-as-commands
  -> techstack -> templates -> datamodel) then build setup (scaffold ->
  foundation headless -> migrate/seed -> docs) then delegates per-feature
  work to the skaileup-slice-impl sub-flow (full loop: brainstorm -> align ->
  plan-vertical -> git-prepare -> implement -> implement-page -> test ->
  recap -> refactor -> commit -> git-finish), run once per feature.
  Quality: unit + integration (no E2E). Replaces the legacy split cli-concept
  + cli flows with one conformant, self-contained tier.
meta:
  category: cli
  tags:
    - variant
    - cli
    - no-ui
    - headless
  icon: i-heroicons-command-line
requires:
  # Self-contained install manifest: contracts its skills read + every skill its
  # nodes run (flow node order). Exact — no inheritance, no extras.
  - contract:@skaile-ai/shared-contracts
  - skill:@skaile-ai/skaileup-scope-scope-project
  - skill:@skaile-ai/concept-brief
  - skill:@skaile-ai/product-spec-features
  - flow:@skaile-ai/architecture
  - flow:@skaile-ai/impl-build-setup
  - flow:@skaile-ai/skaileup-slice-impl
  - skill:@skaile-ai/impl-quality-test-unit
  - skill:@skaile-ai/impl-quality-test-integration
globals:
  research_depth: light
  approval_mode: checkpoint
  subagent_mode: true
  verbosity: standard
entry: scope
nodes:
  # --- Phase containers (visual; must precede their children) ---
  - id: g-conceptualization
    type: group
    position:
      x: -40
      y: 0
    style:
      width: 880
      height: 480
    data:
      label: 'Conceptualization'
      phase: conceptualization
  - id: g-implementation
    type: group
    position:
      x: 1160
      y: 0
    style:
      width: 1080
      height: 480
    data:
      label: 'Implementation'
      phase: implementation
  - id: g-review
    type: group
    position:
      x: 3160
      y: 0
    style:
      width: 280
      height: 480
    data:
      label: 'Review'
      phase: review
  # --- Scope ---
  - id: scope
    type: skill
    position:
      x: 0
      y: 200
    parentNode: g-conceptualization
    data:
      skill: skaileup-scope-scope-project
      label: 'Scope Project'
      optional: false
      parameters: {}
  # --- Linear CLI concept (no UI) ---
  - id: brief
    type: skill
    position:
      x: 200
      y: 200
    parentNode: g-conceptualization
    data:
      skill: concept-brief
      label: 'Concept Brief'
      optional: false
      parameters:
        note: 'Describe CLI commands, flags, and expected output'
  - id: features
    type: skill
    position:
      x: 400
      y: 200
    parentNode: g-conceptualization
    data:
      skill: product-spec-features
      label: 'Features (commands)'
      optional: false
      parameters:
        cli_mode: true
        describe_as_commands: true
  # --- Architecture (delegated to the shared architecture flow) ---
  - id: architecture
    type: sub-flow
    position:
      x: 600
      y: 200
    parentNode: g-conceptualization
    data:
      flow: architecture
      domain: blueprint
      label: 'Architecture blueprint (no system step)'
      pass_context: true
      phase: conceptualization
      parameters:
        system: skip
        note: 'Datamodel covers config files, storage schemas, output formats'
  # --- Build setup (delegated to the shared impl-build-setup flow) ---
  - id: build-setup
    type: sub-flow
    position:
      x: 1200
      y: 200
    parentNode: g-implementation
    data:
      flow: impl-build-setup
      domain: build
      label: 'One-time build setup (headless, data steps optional)'
      pass_context: true
      phase: implementation
      parameters:
        infrastructure: skip
        data_setup: optional
        project_type: cli
        skip_ui_shell: true
  # --- Per-feature impl loop (delegated to the slice-impl flow) ---
  - id: impl-slice-loop
    type: sub-flow
    position:
      x: 2000
      y: 200
    parentNode: g-implementation
    data:
      flow: skaileup-slice-impl
      domain: slice
      label: 'Per-feature impl loop'
      pass_context: true
      phase: implementation
  # --- Quality (unit + integration, no E2E) ---
  - id: q-test-unit
    type: skill
    position:
      x: 3200
      y: 120
    parentNode: g-review
    data:
      skill: impl-quality-test-unit
      label: 'Unit Tests'
      optional: false
      parameters: {}
  - id: q-test-integration
    type: skill
    position:
      x: 3200
      y: 280
    parentNode: g-review
    data:
      skill: impl-quality-test-integration
      label: 'Integration Tests'
      optional: false
      parameters: {}
edges:
  - id: e-scope-brief
    source: scope
    target: brief
    type: flow
  - id: e-brief-features
    source: brief
    target: features
    type: flow
  - id: e-features-architecture
    source: features
    target: architecture
    type: flow
  - id: e-architecture-build-setup
    source: architecture
    target: build-setup
    type: flow
  - id: e-build-setup-impl-slice-loop
    source: build-setup
    target: impl-slice-loop
    type: flow
  - id: e-impl-slice-loop-q-test-unit
    source: impl-slice-loop
    target: q-test-unit
    type: flow
  - id: e-impl-slice-loop-q-test-integration
    source: impl-slice-loop
    target: q-test-integration
    type: flow

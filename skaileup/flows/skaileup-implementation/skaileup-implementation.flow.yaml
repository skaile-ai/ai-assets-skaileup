id: skaileup-implementation
version: '2.0.0'
name: 'SkaileUp Implementation'
description: >-
  The code-build flow — no concept-design pass. The architecture step is
  read-or-generate: if a concept package already exists (handed off, or produced
  by skaileup-concept-only / skaileup-concept-reverse) it reads
  _concept/blueprint/ (techstack -> system -> datamodel); otherwise it generates
  that architecture subset from a one-line product description. Then build setup
  (scaffold -> foundation -> infrastructure(opt) -> migrate -> seed -> docs),
  per-feature work delegated to the skaileup-slice-impl sub-flow (each feature's
  spec elicited just-in-time by the slice's impl-plan brainstorm/align phase),
  and quality (unit + integration + e2e + ready). No UX/brand/journeys/screens/
  mockups — only the architecture needed to write and run code. Use when you want
  to build from an existing concept, or start building immediately without one.
  (Collapses the two former impl-only flows — a handoff gate and a standalone
  variant — that differed only by whether the concept pre-existed.)
meta:
  category: incremental
  tags:
    - impl-only
    - no-concept-design
    - read-or-generate
    - build
  icon: i-heroicons-bolt
requires:
  # Self-contained install manifest: contracts its skills read + every skill its
  # nodes run + the sub-flow it delegates to. Exact — no inheritance, no extras.
  # The architecture subset (techstack/system/datamodel) reads an existing
  # concept package if present, else generates it; no UX/brand/experience skills.
  - contract:@skaile-ai/shared-contracts
  - flow:@skaile-ai/architecture
  - flow:@skaile-ai/impl-build-setup
  - flow:@skaile-ai/skaileup-slice-impl
  - flow:@skaile-ai/quality-gate
globals:
  research_depth: light
  approval_mode: checkpoint
  subagent_mode: true
  verbosity: standard
entry: architecture
nodes:
  # --- Phase containers (visual; must precede their children) ---
  - id: g-conceptualization
    type: group
    position:
      x: -40
      y: 0
    style:
      width: 480
      height: 480
    data:
      label: 'Conceptualization'
      phase: conceptualization
  - id: g-implementation
    type: group
    position:
      x: 560
      y: 0
    style:
      width: 1380
      height: 480
    data:
      label: 'Implementation'
      phase: implementation
  - id: g-review
    type: group
    position:
      x: 1960
      y: 0
    style:
      width: 280
      height: 480
    data:
      label: 'Review'
      phase: review
  # --- Architecture (read-or-generate; delegated to the shared architecture flow) ---
  - id: architecture
    type: sub-flow
    position:
      x: 0
      y: 200
    parentNode: g-conceptualization
    data:
      flow: architecture
      domain: blueprint
      label: 'Architecture blueprint (read-or-generate, no templates step)'
      pass_context: true
      phase: conceptualization
      parameters:
        templates: skip
        note: 'Read _concept/blueprint/ if present, else generate from a one-line product description'
  # --- Build setup (delegated to the shared impl-build-setup flow) ---
  - id: build-setup
    type: sub-flow
    position:
      x: 600
      y: 200
    parentNode: g-implementation
    data:
      flow: impl-build-setup
      domain: build
      label: 'One-time build setup'
      pass_context: true
      phase: implementation
      parameters:
        infrastructure: optional
  # --- Per-feature impl-slice loop (delegated to the impl-slice flow) ---
  - id: impl-slice-loop
    type: sub-flow
    position:
      x: 1800
      y: 200
    parentNode: g-implementation
    data:
      flow: skaileup-slice-impl
      domain: slice
      label: 'Per-feature impl loop (spec elicited per slice)'
      pass_context: true
      phase: implementation
  # --- Quality gate (delegated to the shared quality-gate flow; no ops tail) ---
  - id: quality
    type: sub-flow
    position:
      x: 2000
      y: 200
    parentNode: g-review
    data:
      flow: quality-gate
      domain: quality
      label: 'Quality gate (e2e optional, no ops tail)'
      pass_context: true
      phase: review
      parameters:
        e2e: optional
        ops_tail: skip
edges:
  - id: e-architecture-build-setup
    source: architecture
    target: build-setup
    type: flow
  - id: e-build-setup-impl-slice-loop
    source: build-setup
    target: impl-slice-loop
    type: flow
  - id: e-impl-slice-loop-quality
    source: impl-slice-loop
    target: quality
    type: flow

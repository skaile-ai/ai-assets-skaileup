id: appbuilder-standard
version: '2.0.0'
name: 'Appbuilder Standard'
description: >-
  Multi-user / ≤20 features. High-level concept (brief, goals,
  comparable, brand-visual, inspiration, journeys,
  behaviors(opt), screens, components, features, mockups, mockup-feedback
  cluster) -> impl-build setup -> per-feature work delegated to the unified
  skaileup-slice sub-flow (concept_depth: full — full per-feature concept design
  then impl, run once per feature) -> done. Quality: unit + integration + e2e +
  ready. Ops: review + sync. Iteration semantics: the slice-loop sub-flow node
  runs once per feature; the linear graph below shows one iteration.
meta:
  category: full-stack
  tags:
    - tier
    - appbuilder-standard
    - multi-user
  icon: i-heroicons-squares-2x2
requires:
  # Everything installed when this flow is installed: the contracts its skills
  # read + every skill its nodes run (flow node order). Self-contained — no
  # inheritance, no extras.
  - contract:@skaile-ai/shared-contracts
  - skill:@skaile-ai/skaileup-scope-scope-project
  - flow:@skaile-ai/concept-discovery
  - skill:@skaile-ai/design-brand-visual
  - skill:@skaile-ai/design-inspiration
  - skill:@skaile-ai/experience-journeys
  - skill:@skaile-ai/experience-behaviors
  - skill:@skaile-ai/product-spec-features
  - skill:@skaile-ai/experience-screens
  - skill:@skaile-ai/experience-components
  - skill:@skaile-ai/mockup-walkthrough-astro
  - skill:@skaile-ai/mockup-walkthrough-static-html
  - skill:@skaile-ai/mockup-component-storybook
  - flow:@skaile-ai/mockup-feedback
  - flow:@skaile-ai/architecture
  - flow:@skaile-ai/impl-build-setup
  # Per-feature work is delegated to the unified slice sub-flow; its manifest
  # (and its two sub-flows') transitively provide the slice-concept / impl skills.
  - flow:@skaile-ai/skaileup-slice
  - flow:@skaile-ai/quality-gate
globals:
  research_depth: moderate
  approval_mode: checkpoint
  subagent_mode: false
  verbosity: standard
entry: scope
nodes:
  # --- Phase containers (visual; must precede their children) ---
  - id: g-conceptualization
    type: group
    position:
      x: -40
      y: 0
    style:
      width: 3480
      height: 480
    data:
      label: 'Conceptualization'
      phase: conceptualization
  - id: g-implementation
    type: group
    position:
      x: 3960
      y: 0
    style:
      width: 1480
      height: 480
    data:
      label: 'Implementation'
      phase: implementation
  - id: g-review
    type: group
    position:
      x: 7360
      y: 0
    style:
      width: 280
      height: 480
    data:
      label: 'Review'
      phase: review
  # --- Scope ---
  - id: scope
    type: skill
    position:
      x: 0
      y: 200
    parentNode: g-conceptualization
    data:
      skill: skaileup-scope-scope-project
      label: 'Scope Project'
      optional: false
      parameters: {}
  # --- Discovery (delegated to the shared concept-discovery flow) ---
  - id: discovery
    type: sub-flow
    position:
      x: 200
      y: 200
    parentNode: g-conceptualization
    data:
      flow: concept-discovery
      domain: discovery
      label: 'Concept discovery (brief, goals, comparable)'
      pass_context: true
      phase: conceptualization
      parameters: {}
  # --- High-level concept ---
  - id: brand-visual
    type: skill
    position:
      x: 800
      y: 200
    parentNode: g-conceptualization
    data:
      skill: design-brand-visual
      label: 'Brand Visual'
      optional: false
      parameters: {}
  - id: inspiration
    type: skill
    position:
      x: 1000
      y: 200
    parentNode: g-conceptualization
    data:
      skill: design-inspiration
      label: 'Design Inspiration'
      optional: true
      parameters: {}
  - id: journeys
    type: skill
    position:
      x: 1200
      y: 200
    parentNode: g-conceptualization
    data:
      skill: experience-journeys
      label: 'Experience Journeys'
      optional: false
      parameters: {}
  - id: behaviors-opt
    type: skill
    position:
      x: 1400
      y: 200
    parentNode: g-conceptualization
    data:
      skill: experience-behaviors
      label: 'Experience Behaviors (opt)'
      optional: true
      parameters: {}
  - id: features
    type: skill
    position:
      x: 1600
      y: 200
    parentNode: g-conceptualization
    data:
      skill: product-spec-features
      label: 'Product Features'
      optional: false
      parameters: {}
  - id: screens
    type: skill
    position:
      x: 1800
      y: 200
    parentNode: g-conceptualization
    data:
      skill: experience-screens
      label: 'Experience Screens'
      optional: false
      parameters: {}
  - id: components
    type: skill
    position:
      x: 2000
      y: 200
    parentNode: g-conceptualization
    data:
      skill: experience-components
      label: 'Experience Components'
      optional: false
      parameters: {}
  # --- Mockup renderer routers (first match wins; routes are authoritative) ---
  - id: route-walkthrough
    type: router
    position:
      x: 2100
      y: 100
    parentNode: g-conceptualization
    data:
      label: 'Walkthrough Renderer Router (astro -> static-html)'
      routes:
        - condition: 'stack.astro_available'
          target: mock-walkthrough
        - condition: 'default'
          target: mock-static-fallback
  - id: route-component
    type: router
    position:
      x: 2100
      y: 300
    parentNode: g-conceptualization
    data:
      label: 'Component Renderer Router (storybook or skip)'
      routes:
        - condition: 'stack.storybook_available'
          target: comp-storybook
        - condition: 'default'
          target: null
  - id: mock-walkthrough
    type: skill
    position:
      x: 2200
      y: 100
    parentNode: g-conceptualization
    data:
      skill: mockup-walkthrough-astro
      label: 'Astro Walkthrough Mockup (via router)'
      optional: true
      parameters: {}
  - id: mock-static-fallback
    type: skill
    position:
      x: 2200
      y: 200
    parentNode: g-conceptualization
    data:
      skill: mockup-walkthrough-static-html
      label: 'Static HTML Walkthrough (router default)'
      optional: true
      parameters: {}
  - id: comp-storybook
    type: skill
    position:
      x: 2200
      y: 300
    parentNode: g-conceptualization
    data:
      skill: mockup-component-storybook
      label: 'Storybook Components (via router)'
      optional: true
      parameters: {}
  # --- Mockup feedback (delegated to the shared mockup-feedback flow) ---
  - id: feedback
    type: sub-flow
    position:
      x: 2400
      y: 200
    parentNode: g-conceptualization
    data:
      flow: mockup-feedback
      domain: mockup
      label: 'Mockup feedback loop'
      pass_context: true
      phase: conceptualization
      parameters: {}
  # --- Architecture (delegated to the shared architecture flow) ---
  - id: architecture
    type: sub-flow
    position:
      x: 3200
      y: 200
    parentNode: g-conceptualization
    data:
      flow: architecture
      domain: blueprint
      label: 'Architecture blueprint'
      pass_context: true
      phase: conceptualization
      parameters: {}
  # --- Build setup (delegated to the shared impl-build-setup flow) ---
  - id: build-setup
    type: sub-flow
    position:
      x: 4000
      y: 200
    parentNode: g-implementation
    data:
      flow: impl-build-setup
      domain: build
      label: 'One-time build setup'
      pass_context: true
      phase: implementation
      parameters:
        infrastructure: optional
  # --- Per-feature loop (delegated to the unified slice flow) ---
  - id: slice-loop
    type: sub-flow
    position:
      x: 5200
      y: 200
    parentNode: g-implementation
    data:
      flow: skaileup-slice
      domain: slice
      label: 'Per-feature slice loop (concept then impl, full concept design)'
      pass_context: true
      phase: implementation
      parameters:
        concept_depth: full
  # --- Quality gate (delegated to the shared quality-gate flow) ---
  - id: quality
    type: sub-flow
    position:
      x: 7400
      y: 200
    parentNode: g-review
    data:
      flow: quality-gate
      domain: quality
      label: 'Quality gate + ops tail'
      pass_context: true
      phase: review
      parameters: {}
edges:
  - id: e-scope-discovery
    source: scope
    target: discovery
    type: flow
  - id: e-discovery-brand-visual
    source: discovery
    target: brand-visual
    type: flow
  - id: e-brand-visual-inspiration
    source: brand-visual
    target: inspiration
    type: optional
  - id: e-inspiration-journeys
    source: inspiration
    target: journeys
    type: flow
  - id: e-journeys-behaviors-opt
    source: journeys
    target: behaviors-opt
    type: optional
  - id: e-behaviors-opt-features
    source: behaviors-opt
    target: features
    type: flow
  - id: e-features-screens
    source: features
    target: screens
    type: flow
  - id: e-screens-components
    source: screens
    target: components
    type: flow
  - id: e-components-route-walkthrough
    source: components
    target: route-walkthrough
    type: parallel
  - id: e-components-route-component
    source: components
    target: route-component
    type: parallel
  - id: e-route-walkthrough-mock-walkthrough
    source: route-walkthrough
    target: mock-walkthrough
    type: optional
  - id: e-route-walkthrough-mock-static-fallback
    source: route-walkthrough
    target: mock-static-fallback
    type: optional
  - id: e-route-component-comp-storybook
    source: route-component
    target: comp-storybook
    type: optional
  - id: e-mock-walkthrough-feedback
    source: mock-walkthrough
    target: feedback
    type: optional
  - id: e-mock-static-fallback-feedback
    source: mock-static-fallback
    target: feedback
    type: optional
  - id: e-comp-storybook-feedback
    source: comp-storybook
    target: feedback
    type: optional
  - id: e-feedback-architecture
    source: feedback
    target: architecture
    type: flow
  - id: e-architecture-build-setup
    source: architecture
    target: build-setup
    type: flow
  - id: e-build-setup-slice-loop
    source: build-setup
    target: slice-loop
    type: flow
  - id: e-slice-loop-quality
    source: slice-loop
    target: quality
    type: flow

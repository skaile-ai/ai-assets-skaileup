id: skaileup-greenfield
version: "0.1.0"
name: Skaileup Greenfield
description: >-
  The full path for a new app, walked top-down in four stages the user approves one by one: frame
  (discovery, brief, the shared vocabulary, journeys), look (brand, the navigation model, the app shell,
  then a Storybook of the empty app frame), data (the data model and how each object is represented,
  then a Storybook of the entity stories), features (behaviours, the per-feature spec loop that grows the
  featureset roster, the screens each feature uses, then the Storybook of screens and journeys and its
  feedback pass). After them the blueprint, the build against the codebase's standards, and the review
  gate (code, interaction patterns, concept) that ends in a release grade. An advisory order: any skill
  also runs on its own, from the middle of a project, when the router names it.
meta:
  icon: i-heroicons-squares-2x2
  onboarding:
    input_style: structured
    fields:
      - app_name
      - problem
      - audience
      - notes
requires:
  # Exact and self-contained: every skill this flow's own nodes run, plus the
  # shared-contracts asset when any of them reads a contract file. No inheritance,
  # no extras. The reference layer is one dir-scoped asset, so it is one ref —
  # the per-file exactness lives on the skills, which is where the reading happens.
  - contract:@skaile-ai/shared-contracts
  - contract:@skaile-ai/app-design-rulebook
  - skill:@skaile-ai/concept-onboard
  - skill:@skaile-ai/concept-research
  - skill:@skaile-ai/concept-brief
  - skill:@skaile-ai/concept-glossary
  - skill:@skaile-ai/design-brand
  - skill:@skaile-ai/experience-journeys
  - skill:@skaile-ai/architecture-datamodel
  - skill:@skaile-ai/experience-interaction
  - skill:@skaile-ai/experience-behaviors
  - skill:@skaile-ai/spec-feature
  - skill:@skaile-ai/experience-screen
  - skill:@skaile-ai/experience-shell
  - skill:@skaile-ai/architecture-techstack
  - skill:@skaile-ai/architecture-system
  - skill:@skaile-ai/mockup-storybook
  - skill:@skaile-ai/mockup-feedback
  - skill:@skaile-ai/build-scaffold
  - skill:@skaile-ai/build-database
  - skill:@skaile-ai/quality-standards
  - skill:@skaile-ai/build-plan
  - skill:@skaile-ai/build-implement
  - skill:@skaile-ai/build-branch
  - skill:@skaile-ai/quality-test
  - skill:@skaile-ai/quality-e2e
  - skill:@skaile-ai/quality-review
  - skill:@skaile-ai/quality-interaction
  - skill:@skaile-ai/ops-review
  - skill:@skaile-ai/quality-release
globals:
  research_depth: moderate
entry: onboard
nodes:
  # Phase containers. They carry the swimlane geometry and the phase every child
  # repeats on its own node — the group's phase wins where the two are read together
  # (forge-concept `flow-layout.ts`), so both come from one table.
  - id: g-conceptualization
    type: group
    position: { x: 0, y: 0 }
    style: { width: 4000, height: 240 }
    data:
      label: Conceptualization
      phase: conceptualization
  - id: g-implementation
    type: group
    position: { x: 4040, y: 0 }
    style: { width: 1280, height: 240 }
    data:
      label: Implementation
      phase: implementation
  - id: g-review
    type: group
    position: { x: 5360, y: 0 }
    style: { width: 1280, height: 240 }
    data:
      label: Review
      phase: review

  - id: onboard
    type: skill
    parentNode: g-conceptualization
    data:
      skill: concept-onboard
      label: Onboard
      phase: conceptualization
  - id: research
    type: skill
    parentNode: g-conceptualization
    data:
      skill: concept-research
      label: Research
      phase: conceptualization
  - id: brief
    type: skill
    parentNode: g-conceptualization
    data:
      skill: concept-brief
      label: Brief
      phase: conceptualization
  - id: glossary
    type: skill
    parentNode: g-conceptualization
    data:
      skill: concept-glossary
      label: Glossary
      phase: conceptualization
  - id: journeys
    type: skill
    parentNode: g-conceptualization
    data:
      skill: experience-journeys
      label: Journeys
      phase: conceptualization
  # Stage look: brand, the navigation model (experience-interaction's first batch), the
  # shell, then the Storybook App frame with one pending page per destination.
  - id: brand
    type: skill
    parentNode: g-conceptualization
    data:
      skill: design-brand
      label: Brand
      phase: conceptualization
  - id: interaction
    type: skill
    parentNode: g-conceptualization
    data:
      skill: experience-interaction
      label: Interaction
      phase: conceptualization
  # the shell takes its destinations from journeys and the glossary's `navigation: primary`
  # objects (`tree/07_screens/shell.md § Writing it` step 2); screens refine it later.
  - id: shell
    type: skill
    parentNode: g-conceptualization
    data:
      skill: experience-shell
      label: App Shell
      phase: conceptualization
  - id: storybook-look
    type: skill
    parentNode: g-conceptualization
    data:
      skill: mockup-storybook
      label: Storybook · look
      phase: conceptualization
  # Stage data: the data model, then the entity stories for every object-map row
  # (experience-interaction's objects batch runs again here through skaileup's walk).
  - id: datamodel
    type: skill
    parentNode: g-conceptualization
    data:
      skill: architecture-datamodel
      label: Data Model
      phase: conceptualization
  - id: storybook-data
    type: skill
    parentNode: g-conceptualization
    data:
      skill: mockup-storybook
      label: Storybook · data
      phase: conceptualization
  # Stage features: behaviours, the spec loop, the screens, then the Storybook of screens,
  # App and journeys and its feedback pass.
  - id: behaviors
    type: skill
    parentNode: g-conceptualization
    data:
      skill: experience-behaviors
      label: Behaviours
      phase: conceptualization
  # spec-feature runs once per feature and adds its roster row; experience-screen runs
  # once per screen the features list. The graph below shows one iteration of each; the
  # loops live in the skill bodies.
  - id: feature
    type: skill
    parentNode: g-conceptualization
    data:
      skill: spec-feature
      label: Feature Spec
      phase: conceptualization
  - id: screen
    type: skill
    parentNode: g-conceptualization
    data:
      skill: experience-screen
      label: Screens
      phase: conceptualization
  - id: storybook
    type: skill
    parentNode: g-conceptualization
    data:
      skill: mockup-storybook
      label: Storybook · features
      phase: conceptualization
  - id: feedback
    type: skill
    parentNode: g-conceptualization
    data:
      skill: mockup-feedback
      label: Feedback
      phase: conceptualization
  # The blueprint follows the approved concept.
  - id: techstack
    type: skill
    parentNode: g-conceptualization
    data:
      skill: architecture-techstack
      label: Tech Stack
      phase: conceptualization
  - id: system
    type: skill
    parentNode: g-conceptualization
    data:
      skill: architecture-system
      label: System
      phase: conceptualization

  - id: scaffold
    type: skill
    parentNode: g-implementation
    data:
      skill: build-scaffold
      label: Scaffold
      phase: implementation
  - id: database
    type: skill
    parentNode: g-implementation
    data:
      skill: build-database
      label: Database
      phase: implementation
  - id: standards
    type: skill
    parentNode: g-implementation
    data:
      skill: quality-standards
      label: Standards
      phase: implementation
  # build-plan and build-implement repeat per feature and per slice; the graph below
  # shows one iteration. The loop lives in those two skill bodies.
  - id: plan
    type: skill
    parentNode: g-implementation
    data:
      skill: build-plan
      label: Plan Slices
      phase: implementation
  - id: implement
    type: skill
    parentNode: g-implementation
    data:
      skill: build-implement
      label: Implement Slice
      phase: implementation
  - id: branch
    type: skill
    parentNode: g-implementation
    data:
      skill: build-branch
      label: Close Branch
      phase: implementation

  - id: test
    type: skill
    parentNode: g-review
    data:
      skill: quality-test
      label: Tests
      phase: review
  - id: e2e
    type: skill
    parentNode: g-review
    data:
      skill: quality-e2e
      label: E2E
      phase: review
  - id: review
    type: skill
    parentNode: g-review
    data:
      skill: quality-review
      label: Code Review
      phase: review
  - id: interaction-check
    type: skill
    parentNode: g-review
    data:
      skill: quality-interaction
      label: Interaction Check
      phase: review
  - id: ops-review
    type: skill
    parentNode: g-review
    data:
      skill: ops-review
      label: Concept Review
      phase: review
  - id: release
    type: skill
    parentNode: g-review
    data:
      skill: quality-release
      label: Release Grade
      phase: review
edges:
  - { id: e-onboard-research, source: onboard, target: research, type: flow }
  - { id: e-research-brief, source: research, target: brief, type: flow }
  - { id: e-brief-glossary, source: brief, target: glossary, type: flow }
  - { id: e-glossary-journeys, source: glossary, target: journeys, type: flow }
  - { id: e-journeys-brand, source: journeys, target: brand, type: flow }
  - { id: e-brand-interaction, source: brand, target: interaction, type: flow }
  - { id: e-interaction-shell, source: interaction, target: shell, type: flow }
  - { id: e-shell-storybook-look, source: shell, target: storybook-look, type: flow }
  - { id: e-storybook-look-datamodel, source: storybook-look, target: datamodel, type: flow }
  - { id: e-datamodel-storybook-data, source: datamodel, target: storybook-data, type: flow }
  - { id: e-storybook-data-behaviors, source: storybook-data, target: behaviors, type: flow }
  - { id: e-behaviors-feature, source: behaviors, target: feature, type: flow }
  - { id: e-feature-screen, source: feature, target: screen, type: flow }
  - { id: e-screen-storybook, source: screen, target: storybook, type: flow }
  - { id: e-storybook-feedback, source: storybook, target: feedback, type: flow }
  - { id: e-feedback-techstack, source: feedback, target: techstack, type: flow }
  - { id: e-techstack-system, source: techstack, target: system, type: flow }
  - { id: e-system-scaffold, source: system, target: scaffold, type: flow }
  - { id: e-scaffold-database, source: scaffold, target: database, type: flow }
  - { id: e-database-standards, source: database, target: standards, type: flow }
  - { id: e-standards-plan, source: standards, target: plan, type: flow }
  - { id: e-plan-implement, source: plan, target: implement, type: flow }
  - { id: e-implement-branch, source: implement, target: branch, type: flow }
  - { id: e-branch-test, source: branch, target: test, type: flow }
  - { id: e-test-e2e, source: test, target: e2e, type: flow }
  - { id: e-e2e-review, source: e2e, target: review, type: flow }
  - { id: e-review-interaction-check, source: review, target: interaction-check, type: flow }
  - { id: e-interaction-check-ops-review, source: interaction-check, target: ops-review, type: flow }

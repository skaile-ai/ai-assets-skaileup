id: skaileup-concept-reverse
version: "0.1.0"
name: Skaileup Concept Reverse
description: >-
  Builds a concept out of an existing repository. Scope fixes the flow, then the repository
  is read for findings only — stack with its confidence grade, routes, screens, data model
  and brand — and the codebase's standards are read. The brief, glossary, brand, journeys,
  data model, interaction design, featuresets, shell, every feature spec and the stack and
  system blueprint are then written from those findings, checked against the interaction
  patterns, ending on a concept review.
meta:
  icon: i-heroicons-arrow-path
  onboarding:
    input_style: repo
    fields:
      - repo_url
      - branch
      - context
requires:
  # Exact and self-contained: every skill this flow's own nodes run, plus the
  # shared-contracts asset when any of them reads a contract file. No inheritance,
  # no extras. The reference layer is one dir-scoped asset, so it is one ref —
  # the per-file exactness lives on the skills, which is where the reading happens.
  - contract:@skaile-ai/shared-contracts
  - skill:@skaile-ai/concept-scope
  - skill:@skaile-ai/concept-reverse
  - skill:@skaile-ai/quality-standards
  - skill:@skaile-ai/concept-brief
  - skill:@skaile-ai/concept-glossary
  - skill:@skaile-ai/design-brand
  - skill:@skaile-ai/experience-journeys
  - skill:@skaile-ai/architecture-datamodel
  - skill:@skaile-ai/experience-interaction
  - skill:@skaile-ai/spec-featuresets
  - skill:@skaile-ai/experience-shell
  - skill:@skaile-ai/spec-feature
  - skill:@skaile-ai/architecture-techstack
  - skill:@skaile-ai/architecture-system
  - skill:@skaile-ai/quality-interaction
  - skill:@skaile-ai/ops-review
globals:
  research_depth: light
entry: scope
nodes:
  # Phase containers. They carry the swimlane geometry and the phase every child
  # repeats on its own node — the group's phase wins where the two are read together
  # (forge-concept `flow-layout.ts`), so both come from one table. This flow builds
  # nothing, so the implementation container stays empty.
  - id: g-conceptualization
    type: group
    position: { x: 0, y: 0 }
    style: { width: 2880, height: 240 }
    data:
      label: Conceptualization
      phase: conceptualization
  - id: g-implementation
    type: group
    position: { x: 2920, y: 0 }
    style: { width: 280, height: 240 }
    data:
      label: Implementation
      phase: implementation
  - id: g-review
    type: group
    position: { x: 3240, y: 0 }
    style: { width: 480, height: 240 }
    data:
      label: Review
      phase: review

  - id: scope
    type: skill
    parentNode: g-conceptualization
    data:
      skill: concept-scope
      label: Scope
      phase: conceptualization
  - id: reverse
    type: skill
    parentNode: g-conceptualization
    data:
      skill: concept-reverse
      label: Reverse Engineer
      phase: conceptualization
  - id: standards
    type: skill
    parentNode: g-conceptualization
    data:
      skill: quality-standards
      label: Standards
      phase: conceptualization
  - id: brief
    type: skill
    parentNode: g-conceptualization
    data:
      skill: concept-brief
      label: Brief
      phase: conceptualization
  - id: glossary
    type: skill
    parentNode: g-conceptualization
    data:
      skill: concept-glossary
      label: Glossary
      phase: conceptualization
  - id: brand
    type: skill
    parentNode: g-conceptualization
    data:
      skill: design-brand
      label: Brand
      phase: conceptualization
  - id: journeys
    type: skill
    parentNode: g-conceptualization
    data:
      skill: experience-journeys
      label: Journeys
      phase: conceptualization
  - id: datamodel
    type: skill
    parentNode: g-conceptualization
    data:
      skill: architecture-datamodel
      label: Data Model
      phase: conceptualization
  - id: interaction
    type: skill
    parentNode: g-conceptualization
    data:
      skill: experience-interaction
      label: Interaction
      phase: conceptualization
  - id: featuresets
    type: skill
    parentNode: g-conceptualization
    data:
      skill: spec-featuresets
      label: Featuresets
      phase: conceptualization
  # shell follows the feature loop: it derives the app-shell navigation from the screens
  # the spec-feature iterations wrote, so it cannot sit before them.
  - id: shell
    type: skill
    parentNode: g-conceptualization
    data:
      skill: experience-shell
      label: App Shell
      phase: conceptualization
  # spec-feature runs once per feature and writes that feature's screens; the graph
  # below shows one iteration. The loop lives in the skill body.
  - id: feature
    type: skill
    parentNode: g-conceptualization
    data:
      skill: spec-feature
      label: Feature Spec
      phase: conceptualization
  - id: techstack
    type: skill
    parentNode: g-conceptualization
    data:
      skill: architecture-techstack
      label: Tech Stack
      phase: conceptualization
  - id: system
    type: skill
    parentNode: g-conceptualization
    data:
      skill: architecture-system
      label: System
      phase: conceptualization

  - id: interaction-check
    type: skill
    parentNode: g-review
    data:
      skill: quality-interaction
      label: Interaction Check
      phase: review
  - id: ops-review
    type: skill
    parentNode: g-review
    data:
      skill: ops-review
      label: Concept Review
      phase: review
edges:
  - { id: e-scope-reverse, source: scope, target: reverse, type: flow }
  - { id: e-reverse-standards, source: reverse, target: standards, type: flow }
  - { id: e-standards-brief, source: standards, target: brief, type: flow }
  - { id: e-brief-glossary, source: brief, target: glossary, type: flow }
  - { id: e-glossary-brand, source: glossary, target: brand, type: flow }
  - { id: e-brand-journeys, source: brand, target: journeys, type: flow }
  - { id: e-journeys-datamodel, source: journeys, target: datamodel, type: flow }
  - { id: e-datamodel-interaction, source: datamodel, target: interaction, type: flow }
  - { id: e-interaction-featuresets, source: interaction, target: featuresets, type: flow }
  - { id: e-featuresets-shell, source: featuresets, target: shell, type: flow }
  - { id: e-shell-feature, source: shell, target: feature, type: flow }
  - { id: e-feature-techstack, source: feature, target: techstack, type: flow }
  - { id: e-techstack-system, source: techstack, target: system, type: flow }
  - { id: e-system-interaction-check, source: system, target: interaction-check, type: flow }
  - { id: e-interaction-check-ops-review, source: interaction-check, target: ops-review, type: flow }
